:root{--bg:#fbfaf6;--fg:#1d1b16;--muted:#6b665a;--line:#e3ded2;--accent:#7a4f1d}

@font-face{font-family:Amiri;src:url(fonts/Amiri-Regular.ttf)}
@font-face{font-family:Amiri;font-weight:bold;src:url(fonts/Amiri-Bold.ttf)}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Amiri,serif;font-size:var(--fs,21px);line-height:1.9}
main{max-width:40em;margin:0 auto;padding:1.2em 16px 5em}

p{margin:0 0 .7em;text-align:justify}

p.quote{margin:.3em 2em .6em 1em;text-indent:0}
p.note{font-size:.85em;color:var(--muted);border-right:3px solid var(--line);padding-right:.7em}
a{color:var(--accent)}

(function(){
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  document.querySelectorAll('[data-path]').forEach(function(el){
    var r=parseFloat(get('wird:pos:'+location.pathname.replace(/index\.html$/,'').replace(/\/$/,'')+el.getAttribute('data-path'))||'0');
    if(r>0.97)el.textContent='✓ قُرئت';else if(r>0)el.textContent=Math.round(r*100)+'٪';});
  var last=get('wird:last');
  if(last){try{last=JSON.parse(last);var a=document.getElementById('cont');
    a.href=last.href;a.textContent='تابع من حيث توقفت: '+last.title;a.hidden=false}catch(e){}}
})();
